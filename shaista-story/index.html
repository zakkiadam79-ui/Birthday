<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04060f" />
  <meta name="description" content="A cinematic birthday story made for Shaista." />
  <title>A Cinematic Story for Shaista</title>

  <!-- Fonts (graceful fallback to Georgia / system fonts when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Living background: gradients + vignette ===== -->
  <div class="bg" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- ===== Particle canvas (drawn in code, no image assets) ===== -->
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- ===== Intro screen ===== -->
  <section id="intro" class="overlay">
    <div class="intro-stack">
      <div class="intro-heart" aria-hidden="true">
        <svg viewBox="0 0 32 29" class="heart-svg">
          <defs>
            <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff9a9a" />
              <stop offset="0.45" stop-color="#e02040" />
              <stop offset="1" stop-color="#8f0f2c" />
            </linearGradient>
          </defs>
          <path d="M16 29C16 29 0 19.5 0 9.3 0 4 4 0 9 0c3.4 0 5.6 1.7 7 3.6C17.4 1.7 19.6 0 23 0c5 0 9 4 9 9.3 0 10.2-16 19.7-16 19.7Z" fill="url(#heartGrad)" />
          <ellipse cx="9" cy="8" rx="4" ry="2.4" fill="rgba(255,255,255,0.55)" transform="rotate(-25 9 8)" />
        </svg>
      </div>

      <div class="eyebrow intro-eyebrow">A Cinematic Story For</div>
      <h1 class="intro-name" id="introName">Shaista</h1>
      <div class="intro-date" id="introDate">December 3 • Turning 19</div>
      <div class="intro-divider" aria-hidden="true"></div>

      <button id="beginBtn" class="begin-btn" type="button">Click to Begin Experience ✨</button>
      <div class="intro-hint">🎧 Best with sound on.</div>
    </div>

    <!-- Optional password step (hidden unless CONFIG.passwordGate is true) -->
    <form id="passwordForm" class="password-form hidden" autocomplete="off">
      <label class="password-label" for="passwordInput">Enter her birthdate to unlock</label>
      <div class="password-row">
        <input id="passwordInput" inputmode="numeric" autocomplete="off" placeholder="DDMMYYYY" />
        <button type="submit" class="begin-btn password-unlock">Unlock ✦</button>
      </div>
      <div class="password-error" id="passwordError">That's not quite it. Try again?</div>
    </form>
  </section>

  <!-- ===== Live-mode lock screen (only used when CONFIG.mode === "live") ===== -->
  <section id="liveLock" class="overlay hidden">
    <div class="intro-stack">
      <div class="intro-heart" aria-hidden="true">
        <svg viewBox="0 0 32 29" class="heart-svg">
          <path d="M16 29C16 29 0 19.5 0 9.3 0 4 4 0 9 0c3.4 0 5.6 1.7 7 3.6C17.4 1.7 19.6 0 23 0c5 0 9 4 9 9.3 0 10.2-16 19.7-16 19.7Z" fill="url(#heartGrad)" />
        </svg>
      </div>
      <div class="intro-lock-text">Your story begins just before midnight.</div>
      <div class="intro-countdown" id="liveCountdown">Opens in 00:00:00</div>
    </div>
  </section>

  <!-- ===== The story stage ===== -->
  <main id="stage" class="hidden">
    <header id="hud">
      <div class="hud-left">
        <div class="name-chip" id="nameChip">Shaista ❤️</div>
        <div class="time-chip"><span id="timeDay">DEC 02</span><span class="time-dot">•</span><span id="timeClock">11:58:55 PM</span></div>
      </div>
      <div class="hud-right" id="hudRight">
        <button class="ctrl" id="btnPause" type="button" aria-label="Pause" title="Pause / Play (Space)">⏸</button>
        <button class="ctrl" id="btnReplay" type="button" aria-label="Replay" title="Replay (R)">↺</button>
        <button class="ctrl" id="btnSkip" type="button" aria-label="Skip" title="Skip to next (→)">⏭</button>
        <button class="ctrl ctrl-sound" id="btnSound" type="button" aria-label="Sound" title="Sound (M)">🔊 Sound ON</button>
        <div class="counter-pill" id="counter">01 / 15</div>
      </div>
    </header>

    <!-- Scenes are rendered here by the engine -->
    <div id="sceneHost" class="scene-host"></div>

    <footer id="progressWrap">
      <div class="progress"><div id="progressFill"></div></div>
      <div class="signature" id="signature">Shaista ❤️</div>
    </footer>
  </main>

  <!-- Soft warm flash used at midnight -->
  <div id="flash" aria-hidden="true"></div>

  <!-- Recording-mode black pre-roll overlay -->
  <div id="recordOverlay" class="hidden">
    <div class="record-text">Press <kbd>SPACE</kbd> to begin</div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04060f;color:#f6f2ff;font-family:system-ui;padding:24px;text-align:center;">
      This birthday experience needs JavaScript to play. Please enable it and reopen.
    </div>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
